project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "modules/*.qmd"
    - "labs/*.ipynb"
    - "reference/*.qmd"
    - "!murshid/"
    - "!course/"
  preview:
    port: 4713

website:
  title: "LLM Application Engineering"
  description: "SDA-AIE-213 — engineering applications on top of LLM APIs and open-weight models."
  site-url: https://mohammadyusif.github.io/llm-application-engineering/
  repo-url: https://github.com/MohammadYusif/llm-application-engineering
  page-navigation: true
  back-to-top-navigation: true
  reader-mode: true
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: setup.qmd
        text: Setup
      - text: Modules
        menu:
          - modules/m1-architecture.qmd
          - modules/m2-apis-and-open-weights.qmd
          - modules/m3-structured-outputs-and-tools.qmd
          - modules/m4-prompts-and-guardrails.qmd
          - modules/m5-evaluation.qmd
          - modules/m6-cost-latency-caching.qmd
      - text: Labs
        menu:
          - labs/lab1-skeleton.ipynb
          - labs/lab2-two-providers.ipynb
          - labs/lab3-tickets-and-tools.ipynb
          - labs/lab4-guarded-pipeline.ipynb
          - labs/lab5-evaluation-harness.ipynb
          - labs/lab6-optimise.ipynb
      - href: capstone.qmd
        text: Capstone
    right:
      - icon: github
        href: https://github.com/MohammadYusif/llm-application-engineering
        aria-label: GitHub

  sidebar:
    style: docked
    collapse-level: 1
    contents:
      - index.qmd
      - setup.qmd
      - section: "Day 1 — From demo to system"
        contents:
          - modules/m1-architecture.qmd
          - labs/lab1-skeleton.ipynb
          - modules/m2-apis-and-open-weights.qmd
          - labs/lab2-two-providers.ipynb
      - section: "Day 2 — Structure and control"
        contents:
          - modules/m3-structured-outputs-and-tools.qmd
          - labs/lab3-tickets-and-tools.ipynb
          - modules/m4-prompts-and-guardrails.qmd
      - section: "Day 3 — Prove it, then pay less"
        contents:
          - labs/lab4-guarded-pipeline.ipynb
          - modules/m5-evaluation.qmd
          - labs/lab5-evaluation-harness.ipynb
          - modules/m6-cost-latency-caching.qmd
          - labs/lab6-optimise.ipynb
      - section: "Day 4 — Ship it"
        contents:
          - capstone.qmd
          - assessment.qmd
      - section: "Reference"
        contents:
          - reference/gateway.qmd
          - reference/architecture.qmd
          - reference/troubleshooting.qmd

  page-footer:
    left: "SDA-AIE-213 · هندسة تطبيقات النماذج اللغوية الكبيرة · SDAIA Academy"
    right:
      - icon: github
        href: https://github.com/MohammadYusif/llm-application-engineering
        text: Repository

format:
  html:
    toc: true
    toc-depth: 3
    toc-title: "On this page"
    anchor-sections: true
    smooth-scroll: true
    code-copy: true
    code-overflow: wrap
    code-line-numbers: false
    respect-user-color-scheme: true
    theme:
      light: [cosmo, theme.scss]
      dark: [darkly, theme.scss]
    mermaid:
      theme: neutral

# Nothing on this site executes: every code block is either read, or run by the
# participant against their own checkout. Numbers quoted in these pages come from
# BENCHMARKS.md, which is generated by commands in the repository.
execute:
  # The lab notebooks are committed WITH their outputs, produced by running them
  # against the compose gateway. Quarto renders those saved outputs; it never
  # executes anything, so the site builds in CI with no gateway and no keys.
  enabled: false

lightbox: auto
